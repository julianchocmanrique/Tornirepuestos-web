name: Inspect or clean unused build cache

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Inspect disk usage or clean unused build cache; never touch application data'
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - inspect-detailed
          - inspect-docker-age
          - inspect-kaptura
          - clean-old-build-cache
          - clean-unused-build-cache
          - clean-all-unused-build-cache

permissions:
  contents: read

# Do not prune while the production deployment is building an image.
concurrency:
  group: tornirepuestos-prod-deploy
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect storage without changing the running application
        uses: appleboy/ssh-action@v1.2.0
        env:
          MAINTENANCE_ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: MAINTENANCE_ACTION
          script: |
            set -euo pipefail
            case "$MAINTENANCE_ACTION" in
              inspect|inspect-detailed|inspect-docker-age|inspect-kaptura|clean-old-build-cache|clean-unused-build-cache|clean-all-unused-build-cache) ;;
              *) echo "Unsupported maintenance action"; exit 1 ;;
            esac
            CONTAINER_NAME=tornirepuestos-web
            before="$(docker inspect --format '{{.Id}} {{.Image}} {{.State.StartedAt}} {{.State.Running}}' "$CONTAINER_NAME")"
            echo "=== Filesystem usage before ==="
            df -h /
            df -i /
            echo "=== Docker usage before ==="
            docker system df
            if [ "$MAINTENANCE_ACTION" = "inspect-kaptura" ]; then
              echo "=== Kaptura service memory (bytes) ==="
              for unit in $(systemctl list-units --all --type=service --no-legend --plain | awk 'tolower($1) ~ /kaptura/ {print $1}'); do
                systemctl show "$unit" --property=Id,ActiveState,MainPID,MemoryCurrent,MemoryPeak,WorkingDirectory,ControlGroup
              done
              echo "=== Kaptura process RSS (KiB; metadata only) ==="
              for path in /proc/[0-9]*/cwd; do
                cwd="$(readlink "$path" 2>/dev/null || true)"
                case "$cwd" in
                  *[Kk][Aa][Pp][Tt][Uu][Rr][Aa]*)
                    pid="${path#/proc/}"; pid="${pid%/cwd}"
                    ps -p "$pid" -o pid=,comm=,rss= || true
                    printf 'cwd=%s\n' "$cwd"
                    ;;
                esac
              done
              echo "=== Kaptura disk usage (allocated bytes; nested totals overlap) ==="
              find /var/www /srv /opt /root /root/.openclaw/workspace /var/backups /tmp -maxdepth 3 -iname '*kaptura*' -prune -print 2>/dev/null | sort -u | while IFS= read -r path; do
                if [ -L "$path" ]; then
                  printf 'SYMLINK %s -> %s\n' "$path" "$(readlink "$path")"
                elif [ -d "$path" ]; then
                  du -x -B1 -d1 "$path" 2>/dev/null | sort -n || true
                elif [ -f "$path" ]; then
                  du -B1 "$path"
                fi
              done
              echo "=== Host RAM ==="
              free -b
            fi
            if [ "$MAINTENANCE_ACTION" = "inspect-docker-age" ]; then
              # Creation dates and current references are not proof of last use.
              echo "=== Image metadata ==="
              for id in $(docker image ls -aq --no-trunc | sort -u); do
                docker image inspect --format '{"id":{{json .Id}},"tags":{{json .RepoTags}},"created":{{json .Created}},"size":{{json .Size}}}' "$id"
              done
              echo "=== Container metadata ==="
              for id in $(docker ps -aq); do
                docker inspect --format '{"name":{{json .Name}},"image":{{json .Image}},"created":{{json .Created}},"status":{{json .State.Status}},"started":{{json .State.StartedAt}},"finished":{{json .State.FinishedAt}},"mounts":{{json .Mounts}}}' "$id"
              done
              echo "=== Volume metadata ==="
              for id in $(docker volume ls -q); do
                docker volume inspect --format '{"name":{{json .Name}},"created":{{json .CreatedAt}}}' "$id"
              done
              echo "=== Image disk accounting ==="
              docker system df -v
            fi
            if [ "$MAINTENANCE_ACTION" = "inspect-detailed" ]; then
              echo "=== Directory sizes (metadata only) ==="
              for directory in / /var /var/lib /var/log /root /tmp; do
                du -xhd1 "$directory" 2>/dev/null | sort -h || true
              done
              echo "=== System journal size ==="
              journalctl --disk-usage
              echo "=== Docker image and cache sizes ==="
              docker system df -v
              echo "=== Container log sizes (not contents) ==="
              for container in $(docker ps -aq); do
                docker inspect --format '{{.Name}} {{.State.Status}}' "$container"
                log="$(docker inspect --format '{{.LogPath}}' "$container")"
                if [ -n "$log" ] && [ -f "$log" ]; then du -h "$log"; fi
              done
            fi
            if [ "$MAINTENANCE_ACTION" = "clean-old-build-cache" ]; then
              # Never prune volumes, images or containers; never restart services.
              docker builder prune --all --force --filter 'until=24h' --keep-storage 2GB
            elif [ "$MAINTENANCE_ACTION" = "clean-unused-build-cache" ]; then
              docker builder prune --all --force --keep-storage 2GB
            elif [ "$MAINTENANCE_ACTION" = "clean-all-unused-build-cache" ]; then
              # Emergency full disk: remove all unused compilation cache, not images or data.
              docker builder prune --all --force
            fi
            echo "=== Filesystem usage after ==="
            df -h /
            echo "=== Docker usage after ==="
            docker system df
            after="$(docker inspect --format '{{.Id}} {{.Image}} {{.State.StartedAt}} {{.State.Running}}' "$CONTAINER_NAME")"
            test "$before" = "$after"
            test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = true
            echo "Application container unchanged: same ID, image and start time."
            docker exec "$CONTAINER_NAME" node -e "Promise.all(['/', '/api/baile/public'].map(async p => { const r=await fetch('http://127.0.0.1:3000'+p); console.log(p, r.status); if(!r.ok) throw new Error('Health check failed'); })).catch(() => process.exit(1))"
