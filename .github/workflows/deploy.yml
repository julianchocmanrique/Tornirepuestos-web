name: Deploy Tornirepuestos-web to VPS

on:
  workflow_dispatch:

concurrency:
  group: tornirepuestos-prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/.openclaw/workspace/Tornirepuestos-web
            git fetch --all
            git reset --hard origin/main
            if [ -f /etc/nginx/sites-available/tornirepuestos.conf ]; then
              if grep -q "client_max_body_size" /etc/nginx/sites-available/tornirepuestos.conf; then
                sed -i 's/client_max_body_size .*/client_max_body_size 25M;/' /etc/nginx/sites-available/tornirepuestos.conf
              else
                sed -i '/server_name/a \    client_max_body_size 25M;' /etc/nginx/sites-available/tornirepuestos.conf
              fi
              nginx -t
              systemctl reload nginx
            fi
            cd /root/.openclaw/workspace/deployments/tornirepuestos-web
            docker compose up -d --build --remove-orphans
            docker compose ps
